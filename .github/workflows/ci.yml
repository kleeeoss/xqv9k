name: CI Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          pytest backend/tests/ -v --tb=short

  frontend-checks:
    name: Frontend Quality, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Vitest Component Tests
        working-directory: frontend
        run: npm test

      - name: Production Vite Build
        working-directory: frontend
        run: npm run build

  e2e-playwright:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium & Dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: frontend
        env:
          PYTHONPATH: .
        run: npx playwright test

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-smoke-test:
    name: Docker Build & Container Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Container Image
        run: |
          docker build -t xqv9k-terminal:ci .

      - name: Verify Container Rootfs & Security
        run: |
          echo "Inspecting /app rootfs:"
          docker run --rm xqv9k-terminal:ci ls -la /app
          
          echo "Verifying no credentials or venv leaked:"
          docker run --rm xqv9k-terminal:ci find /app -name "*.env*" -o -name ".venv" -o -name ".git" | grep -v "dist" || echo "✓ Rootfs clean"

      - name: Run Container Smoke Test
        run: |
          CID=$(docker run -d -p 8000:8000 xqv9k-terminal:ci)
          sleep 4
          
          echo "Pinging /api/health..."
          curl -f http://127.0.0.1:8000/api/health
          
          echo "Querying /api/trading-desk for 2026-01-15..."
          curl -f "http://127.0.0.1:8000/api/trading-desk?delivery_date=2026-01-15" >/dev/null
          
          echo "Querying /api/accuracy-audit..."
          curl -f "http://127.0.0.1:8000/api/accuracy-audit" >/dev/null
          
          echo "Querying Frontend Single-Page App root..."
          curl -f http://127.0.0.1:8000/ >/dev/null
          
          docker stop $CID
          docker rm $CID
          echo "✓ Container smoke tests completed successfully"
